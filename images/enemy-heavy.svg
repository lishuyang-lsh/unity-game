<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.9" result="b"/>
      <feOffset in="b" dy="2.8" result="o"/>
      <feFlood flood-color="#08060a" flood-opacity="0.5" result="f"/>
      <feComposite in="f" in2="o" operator="in" result="sh"/>
      <feMerge>
        <feMergeNode in="sh"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fuse" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#eceff2"/>
      <stop offset="100%" stop-color="#464f5a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e6c78"/>
      <stop offset="50%" stop-color="#ccd6de"/>
      <stop offset="100%" stop-color="#5e6c78"/>
    </linearGradient>
    <radialGradient id="can" cx="50%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#d8eefc"/>
      <stop offset="100%" stop-color="#587088"/>
    </radialGradient>
    <radialGradient id="noz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdc98"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </radialGradient>
    <linearGradient id="intake" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a3440"/>
      <stop offset="100%" stop-color="#586674"/>
    </linearGradient>
  </defs>
  <g filter="url(#sh)">
    <!-- Su-27 俯视：宽Lambda翼 + 双垂尾 + 双进气道 -->
    <path d="M100 8 L112 26 L118 44 L116 58 L100 66 L84 58 L82 44 L88 26 Z" fill="url(#fuse)"/>
    <ellipse cx="100" cy="32" rx="9" ry="11" fill="url(#can)"/>
    <path d="M100 16 L100 62" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.75"/>

    <!-- LERX 边条翼 -->
    <path d="M100 58 L78 68 L62 82 L74 88 L96 74 L100 66 Z" fill="#7a8894" opacity="0.85"/>
    <path d="M100 58 L122 68 L138 82 L126 88 L104 74 L100 66 Z" fill="#7a8894" opacity="0.85"/>

    <!-- 主翼 -->
    <path d="M100 68 L68 82 L28 118 L8 148 L6 162 L32 168 L72 128 L94 96 L98 78 Z" fill="url(#wing)"/>
    <path d="M100 68 L132 82 L172 118 L192 148 L194 162 L168 168 L128 128 L106 96 L102 78 Z" fill="url(#wing)"/>
    <path d="M28 118 L72 128 L32 168" fill="#556270" opacity="0.52"/>
    <path d="M172 118 L128 128 L168 168" fill="#556270" opacity="0.52"/>
    <path d="M68 82 L72 128" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.55"/>
    <path d="M132 82 L128 128" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.55"/>

    <!-- 机身 -->
    <path d="M100 62 L112 96 L114 132 L110 158 L100 168 L90 158 L86 132 L88 96 Z" fill="url(#fuse)"/>
    <path d="M86 88 L114 88 M84 108 L116 108 M86 128 L114 128" stroke="#38424e" stroke-opacity="0.36" stroke-width="0.6"/>

    <!-- 双进气道（俯视矩形） -->
    <rect x="82" y="72" width="12" height="28" rx="2" fill="url(#intake)" opacity="0.88"/>
    <rect x="106" y="72" width="12" height="28" rx="2" fill="url(#intake)" opacity="0.88"/>
    <rect x="84" y="74" width="8" height="4" rx="1" fill="#ffffff" opacity="0.08"/>
    <rect x="108" y="74" width="8" height="4" rx="1" fill="#ffffff" opacity="0.08"/>

    <!-- 双垂尾 -->
    <path d="M88 132 L78 142 L72 168 L80 172 L88 152 L92 138 Z" fill="#404c58"/>
    <path d="M112 132 L122 142 L128 168 L120 172 L112 152 L108 138 Z" fill="#404c58"/>

    <!-- 双发尾喷口 -->
    <ellipse cx="92" cy="158" rx="5" ry="3.5" fill="url(#noz)"/>
    <ellipse cx="108" cy="158" rx="5" ry="3.5" fill="url(#noz)"/>
    <ellipse cx="92" cy="158" rx="2.2" ry="1.5" fill="#fff0b8" opacity="0.72"/>
    <ellipse cx="108" cy="158" rx="2.2" ry="1.5" fill="#fff0b8" opacity="0.72"/>

    <!-- 翼下挂点 -->
    <circle cx="32" cy="158" r="2.2" fill="#3a4650"/>
    <circle cx="168" cy="158" r="2.2" fill="#3a4650"/>
    <circle cx="52" cy="138" r="1.8" fill="#3a4650"/>
    <circle cx="148" cy="138" r="1.8" fill="#3a4650"/>
  </g>
</svg>
