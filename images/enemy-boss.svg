<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="sh" x="-32%" y="-32%" width="164%" height="164%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feOffset in="b" dy="3" result="o"/>
      <feFlood flood-color="#040810" flood-opacity="0.52" result="f"/>
      <feComposite in="f" in2="o" operator="in" result="sh"/>
      <feMerge>
        <feMergeNode in="sh"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fuse" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#3e4854"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a6876"/>
      <stop offset="45%" stop-color="#dde6ee"/>
      <stop offset="100%" stop-color="#5a6876"/>
    </linearGradient>
    <radialGradient id="can" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ecf8ff"/>
      <stop offset="100%" stop-color="#567088"/>
    </radialGradient>
    <radialGradient id="noz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0"/>
      <stop offset="60%" stop-color="#b84818"/>
      <stop offset="100%" stop-color="#281810"/>
    </radialGradient>
    <linearGradient id="stealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#sh)">
    <!-- F-22 俯视：菱形隐身主翼 + 外倾双垂尾 + 折线隐身棱线 -->
    <path d="M100 6 L118 24 L124 42 L120 56 L100 62 L80 56 L76 42 L82 24 Z" fill="url(#fuse)"/>
    <ellipse cx="100" cy="28" rx="9" ry="10" fill="url(#can)"/>
    <path d="M88 22 L112 22 M86 38 L114 38" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.55"/>
    <path d="M100 12 L100 58" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.8"/>

    <!-- 梯形隐身主翼 -->
    <path d="M100 58 L72 74 L34 112 L12 142 L8 158 L34 164 L78 122 L96 88 L100 72 Z" fill="url(#wing)"/>
    <path d="M100 58 L128 74 L166 112 L188 142 L192 158 L166 164 L122 122 L104 88 L100 72 Z" fill="url(#wing)"/>
    <path d="M34 112 L78 122 L34 164" fill="#4e5a66" opacity="0.58"/>
    <path d="M166 112 L122 122 L166 164" fill="#4e5a66" opacity="0.58"/>

    <!-- 机身折线 -->
    <path d="M100 56 L114 88 L116 124 L112 154 L100 172 L88 154 L84 124 L86 88 Z" fill="url(#fuse)"/>
    <path d="M92 72 L108 72 L106 88 L94 88 Z" fill="#5c6a78" opacity="0.65"/>
    <path d="M90 96 L110 96 L108 112 L92 112 Z" fill="#5c6a78" opacity="0.55"/>
    <path d="M88 120 L112 120 L110 136 L90 136 Z" fill="#5c6a78" opacity="0.45"/>
    <path d="M100 56 L100 172" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.7"/>
    <path d="M86 88 L114 88 M84 108 L116 108 M86 128 L114 128" stroke="#36424e" stroke-opacity="0.34" stroke-width="0.55"/>

    <!-- 外倾双垂尾 -->
    <path d="M90 138 L76 150 L68 176 L78 180 L88 158 L92 144 Z" fill="#3a4652"/>
    <path d="M110 138 L124 150 L132 176 L122 180 L112 158 L108 144 Z" fill="#3a4652"/>
    <path d="M76 150 L68 176" stroke="url(#stealth)" stroke-width="0.8"/>
    <path d="M124 150 L132 176" stroke="url(#stealth)" stroke-width="0.8"/>

    <!-- 二维矢量喷口 -->
    <path d="M88 156 L92 168 L96 156 Z" fill="url(#noz)"/>
    <path d="M112 156 L108 168 L104 156 Z" fill="url(#noz)"/>
    <ellipse cx="92" cy="160" rx="2.5" ry="1.8" fill="#fff8c0" opacity="0.8"/>
    <ellipse cx="108" cy="160" rx="2.5" ry="1.8" fill="#fff8c0" opacity="0.8"/>

    <!-- 翼前缘 -->
    <path d="M12 142 L34 112" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.1" fill="none"/>
    <path d="M188 142 L166 112" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.1" fill="none"/>

    <!-- 弹舱缝 -->
    <rect x="94" y="98" width="12" height="2" rx="0.5" fill="#2a3440" opacity="0.7"/>
    <rect x="94" y="108" width="12" height="2" rx="0.5" fill="#2a3440" opacity="0.55"/>
  </g>
</svg>
